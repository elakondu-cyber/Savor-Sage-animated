<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savor & Sage — Contact & Booking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="logo">Savor & Sage</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="menu.html">Menu</a></li>
      <li><a href="contact.html" class="active">Contact & Booking</a></li>
    </ul>
  </nav>

  <!-- Booking Header -->
  <header class="page-header">
    <h1>Reserve Your Experience</h1>
    <p>Secure your table for an unforgettable evening of food and atmosphere.</p>
  </header>

  <!-- Booking Form Section -->
  <section class="container" style="margin-top: 40px; margin-bottom: 60px;">
    <div class="form-card">
      <form>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" placeholder="e.g., Jonathan Doe" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" placeholder="e.g., jonathan@example.com" required>
        </div>
        <div class="form-group">
          <label>Number of Guests</label>
          <input type="number" placeholder="2 People" min="1" max="20" required>
        </div>
        <div class="form-group">
          <label>Reservation Date & Time</label>
          <input type="datetime-local" required>
        </div>
        <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer; text-align: center;">Confirm Table Reservation</button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Savor & Sage Restaurant. All Rights Reserved.</p>
  </footer>

</body>
</html>
